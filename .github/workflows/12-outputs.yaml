name: 12 - Working with Outputs

on: 
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        options:
          - success
          - failure
        default: success
        description: "Build Status Choice"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_OUTPUT path
        run: |
          echo $GITHUB_OUTPUT
      
      - name: build
        id: build
        run: echo "status= ${{ inputs.build-status }} " >> $GITHUB_OUTPUT
    
    outputs:
      name: build-status
      run: |
        echo "${{ inputs.build-status.build }}"
     


        
