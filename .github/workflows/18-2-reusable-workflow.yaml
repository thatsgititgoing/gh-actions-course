name: 18 - 2 - Reusable Workflows

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/18-1-reusable-workflows.yaml
    with:
      working-directory: /apps
  
  print-outputs:
    runs-on: ubuntu-latest
    needs:
      - deploy
    steps:
      - name: Print outputs
        run: |
          echo "Build status: ${{ needs.deploy.output.build-status }}"
          echo "URL: ${{ outputs.url }}"
    
